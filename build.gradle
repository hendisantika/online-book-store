buildscript {
    // commons-lang3 < 3.18.0 (CVE, Dependabot alert #136) arrives transitively via
    // spring-boot-gradle-plugin -> spring-boot-buildpack-platform -> commons-compress.
    // Dependabot cannot update transitive Gradle deps, so force a patched version here.
    // Remove once spring-boot-gradle-plugin ships commons-lang3 >= 3.18.0 itself.
    configurations.classpath {
        resolutionStrategy.force 'org.apache.commons:commons-lang3:3.21.0'
    }
}

plugins {
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.hendisantika'
version = '0.0.1-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.mysql:mysql-connector-j'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
